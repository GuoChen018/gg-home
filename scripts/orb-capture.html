<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: #f5f5f5; }
  canvas { display: block; margin: 0 auto; border-radius: 50%; }
</style>
</head>
<body>
<canvas id="orb" width="440" height="440" style="width:440px;height:440px"></canvas>
<script>
const canvas = document.getElementById('orb');
const gl = canvas.getContext('webgl', { antialias: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
const vert = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0, 1); }`;
const frag = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p);
  vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), u.x),
             mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){ v += a * vnoise(p); p = p*2.0 + vec2(1.7, 9.2); a *= 0.5; }
  return v;
}
vec3 rgb2oklab(vec3 c){
  float l = 0.4122214708*c.r + 0.5363325363*c.g + 0.0514459929*c.b;
  float m = 0.2119034982*c.r + 0.6806995451*c.g + 0.1073969566*c.b;
  float s = 0.0883024619*c.r + 0.2817188376*c.g + 0.6299787005*c.b;
  l = pow(l, 1.0/3.0); m = pow(m, 1.0/3.0); s = pow(s, 1.0/3.0);
  return vec3(0.2104542553*l + 0.7936177850*m - 0.0040720468*s,
              1.9779984951*l - 2.4285922050*m + 0.4505937099*s,
              0.0259040371*l + 0.7827717662*m - 0.8086757660*s);
}
vec3 oklab2rgb(vec3 c){
  float l = c.x + 0.3963377774*c.y + 0.2158037573*c.z;
  float m = c.x - 0.1055613458*c.y - 0.0638541728*c.z;
  float s = c.x - 0.0894841775*c.y - 1.2914855480*c.z;
  l = l*l*l; m = m*m*m; s = s*s*s;
  return vec3( 4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
              -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
              -0.0041960863*l - 0.7034186147*m + 1.7076147010*s);
}
vec3 oklabMix(vec3 a, vec3 b, float t){ return oklab2rgb(mix(rgb2oklab(a), rgb2oklab(b), t)); }
void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  uv.y = 1.0 - uv.y;
  vec2 c = uv - 0.5;
  float dist = length(c) * 2.0;
  float t = u_time * 0.25;
  vec2 p = c * 2.5;
  vec2 q = vec2(fbm(p + vec2(t, 0.0)), fbm(p + vec2(0.0, t) + vec2(5.2)));
  vec2 r = vec2(fbm(p + q*1.4 + vec2(1.7, 9.2)), fbm(p + q*1.4 + vec2(8.3, 2.8)));
  float smoke = fbm(p + r*2.0 + vec2(t*0.9));
  vec2 hotspot = vec2(-0.18, 0.30);
  float hotMask = smoothstep(0.55, 0.05, length(c - hotspot));
  float warpedY = c.y + (smoke - 0.5)*0.45 + (r.x - 0.5)*0.25;
  float warmth = smoothstep(-0.05, 0.40, warpedY) * mix(0.4, 1.0, hotMask);
  warmth = clamp(warmth, 0.0, 1.0);
  vec3 violet = vec3(0.50, 0.46, 0.88);
  vec3 lavender = vec3(0.66, 0.62, 0.92);
  vec3 pink = vec3(0.94, 0.70, 0.80);
  vec3 peach = vec3(0.99, 0.76, 0.58);
  vec3 orange = vec3(0.99, 0.65, 0.40);
  vec3 base = oklabMix(violet, lavender, smoothstep(0.0, 1.0, smoke*0.6 + 0.4));
  vec3 col = oklabMix(base, pink, smoothstep(0.05, 0.45, warmth));
  col = oklabMix(col, peach, smoothstep(0.35, 0.75, warmth));
  col = oklabMix(col, orange, smoothstep(0.70, 0.95, warmth));
  float lum = hotMask * smoothstep(0.3, 0.9, warmth) * 0.12;
  col += vec3(lum, lum*0.85, lum*0.7);
  float grain = hash(floor(gl_FragCoord.xy * 1.7));
  col += (grain - 0.5) * 0.11;
  float mask = 1.0 - smoothstep(0.98, 1.0, dist);
  vec3 bg = vec3(0.961, 0.961, 0.961);
  col = mix(bg, col, mask);
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;
function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uRes = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');
gl.viewport(0, 0, 440, 440);
let start = null;
function frame(ts) {
  if (!start) start = ts;
  gl.uniform2f(uRes, 440, 440);
  gl.uniform1f(uTime, (ts - start) / 1000);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
